<!DOCTYPE html>
<html>
<head>
    <title> Web Dashboard</title>
    <!-- 1. Carichiamo la libreria per parlare con Mosquitto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js" type="text/javascript"></script>  
    <!-- 2. Carichiamo le icone di Google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #e9ecef; }
         .container { margin-top: 50px; background: white; display: inline-block; padding: 40px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 850px; }
         #icona-movimento { font-size: 120px; color: #555; transition: 0.3s; }
         .status-badge { padding: 5px 10px; border-radius: 5px; font-size: 12px; display: inline-block; margin-top: 20px; }
         .connesso { background: #d4edda; color: #155724; }
         .disconnesso { background: #f8d7da; color: #721c24; }
         /* Stile per il contenitore delle slide */
         #slide-container { width: 100%; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Indicatore connessione al Broker -->
        <div id="label-connessione" class="status-badge disconnesso">Broker: Disconnesso</div>
        
        <h1>Controllo Presentazione Gestuale</h1>
        
        <!-- Qui cambierà il simbolo -->
        <span id="icona-movimento" class="material-icons">sensors</span>
        
        <!-- Qui cambierà il testo -->
        <h2 id="testo-movimento">In attesa dello smartwatch...</h2>

        <p id="slide-counter">Slide 1 / 4</p>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ccc;">

        <!-- CONTENITORE PRESENTAZIONE -->

        <div id="slide-container">
            <img
                    id = "slide-viewer"
                    src= "prova_img/slide1.png"
                    alt = "Presentazione"
                    style = "
                        width: 100%;
                        max-height: 500px;
                        object-fit: contain;
                        border: 2px solid #333;
                        border-radius: 8px;
                        background: white;
                        transition: transform 0.3s;

                            "

            >


        </div>



    </div>

    <!-- Colleghiamo il file JavaScript -->
    <script src="app.js"></script>
</body>
</html>
